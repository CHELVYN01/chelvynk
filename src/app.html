<!doctype html>
<html lang="id">

<head>
	<meta charset="utf-8" />
	<!-- PNG favicon for Google Search (Google doesn't support SVG favicons) -->
	<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
	<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
	<!-- SVG favicon for modern browsers -->
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="mask-icon" href="/favicon.svg" color="#f97316" />
	<link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<script>
		// Prevent FOUC (Flash of Unstyled Content) for Dark Mode
		(function () {
			try {
				const localTheme = localStorage.getItem('theme');
				const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (localTheme === 'dark' || (!localTheme && systemTheme)) {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			} catch (e) {
				console.error('Theme detection failed', e);
			}
		})();
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
